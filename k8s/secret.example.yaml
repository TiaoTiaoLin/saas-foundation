# Template only. CI does not deploy this file.
#
#   cp k8s/secret.example.yaml k8s/secret.yaml     (secret.yaml is git-ignored)
#   edit the values, then: kubectl apply -f k8s/secret.yaml
#
# Flyway runs as an owner role that can migrate the schema. The application connects as the
# restricted role from docker/postgres/init-rls-role.sql so that row-level security applies.
apiVersion: v1
kind: Secret
metadata:
  name: saas-foundation-secrets
  labels:
    app.kubernetes.io/name: saas-foundation
    app.kubernetes.io/part-of: saas-platform
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "saas_app"
  SPRING_DATASOURCE_PASSWORD: "change-me"
  SPRING_FLYWAY_USER: "saas"
  SPRING_FLYWAY_PASSWORD: "change-me"
  REDIS_PASSWORD: "change-me"
  KAFKA_USERNAME: "change-me"
  KAFKA_PASSWORD: "change-me"
  KAFKA_CA_PEM: "-----BEGIN CERTIFICATE-----\nchange-me\n-----END CERTIFICATE-----"
  # At least 32 bytes.
  JWT_SECRET: "change-me-to-a-long-random-string-of-32-bytes-or-more"
  RESEND_API_KEY: "re_change_me"
  SUPABASE_SERVICE_ROLE_KEY: "change-me"
  STRIPE_SECRET_KEY: "sk_test_change_me"
  STRIPE_WEBHOOK_SECRET: "whsec_change_me"
  STRIPE_PRO_PRICE_ID: "price_change_me"
