# Non-secret settings read by application-prod.yml. Replace the example values before applying.
apiVersion: v1
kind: ConfigMap
metadata:
  name: saas-foundation-config
  labels:
    app.kubernetes.io/name: saas-foundation
    app.kubernetes.io/part-of: saas-platform
data:
  # JDBC URL without credentials. Credentials are in the Secret.
  DB_URL: "jdbc:postgresql://postgres.example.internal:5432/saas_foundation?sslmode=require"
  REDIS_HOST: "redis.example.internal"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.example.internal:9092"
  # Browser origin allowed by CORS, and the base URL used in email links and Stripe return URLs.
  WEB_ORIGIN: "https://app.example.com"
  APP_BASE_URL: "https://app.example.com"
  RESEND_FROM: "Saas Foundation <no-reply@example.com>"
  SUPABASE_URL: "https://project-ref.supabase.co"
  SUPABASE_BUCKET: "images"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
  OTEL_SAMPLING_PROBABILITY: "0.1"
