spring:
  application:
    name: saas-foundation

  datasource:
    url: jdbc:postgresql://localhost:5432/saas_foundation
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: saas-hikari
      data-source-properties:
        ApplicationName: saas-foundation
        reWriteBatchedInserts: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/saas_foundation
    baseline-on-migrate: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: saas-foundation
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: true
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        api.latency: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
        api.latency: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s
        api.latency: 50ms, 100ms, 200ms, 500ms, 1s
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    annotations:
      enabled: true

resilience4j:
  circuitbreaker:
    # Lower order is the outer aspect, so retries finish before this fallback runs.
    circuit-breaker-aspect-order: 1
    instances:
      emailProvider:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - com.saas.foundation.integration.email.EmailProviderException
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
  retry:
    # Inner aspect. Must stay above the circuit-breaker order.
    retry-aspect-order: 2
    instances:
      emailProvider:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - com.saas.foundation.integration.email.EmailProviderException
          - java.io.IOException

saas:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  tenancy:
    header-name: X-Tenant-ID
    active-cache-key-prefix: "tenant:active:"
    active-cache-ttl: 1m
    excluded-path-patterns:
      - /actuator/**
      - /error
      - /v3/api-docs/**
      - /swagger-ui/**
      - /api/v1/auth/**
      - /api/v1/tenants/registrations
      - /api/v1/media
      - /api/v1/billing/webhook
  rate-limit:
    enabled: true
    capacity: 100
    window: 1m
    key-prefix: "rl:tenant:"
    excluded-path-patterns:
      - /actuator/**
      - /error
  auth-rate-limit:
    enabled: true
    key-prefix: "rl:auth:"
    login-per-ip:
      capacity: 20
      window: 1m
    login-per-email:
      capacity: 5
      window: 5m
    signup-per-ip:
      capacity: 5
      window: 1h
    refresh-per-ip:
      capacity: 60
      window: 1m
    password-change-per-ip:
      capacity: 20
      window: 1m
    password-change-per-user:
      capacity: 5
      window: 15m
    password-reset-per-ip:
      capacity: 5
      window: 15m
    password-reset-per-email:
      capacity: 3
      window: 1h
  kafka:
    enabled: true
    tenant-registered-topic: tenant.registered
  integrations:
    email:
      api-key: ${RESEND_API_KEY:}
      from: ${RESEND_FROM:}
  security:
    jwt:
      issuer: saas-foundation
      access-token-ttl: 15m
    refresh-token:
      ttl: 30d
    password-reset:
      ttl: 30m
      app-base-url: ${APP_BASE_URL:http://localhost:5173}
    membership-invite:
      ttl: 7d
      app-base-url: ${APP_BASE_URL:http://localhost:5173}
  storage:
    signed-url-ttl: 1h
    local-directory: ${java.io.tmpdir}/saas-foundation-images
    signing-secret: local-dev-only-media-signing-secret-32b
  billing:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    pro-price-id: ${STRIPE_PRO_PRICE_ID:}
    app-base-url: ${APP_BASE_URL:http://localhost:5173}

logging:
  level:
    root: INFO
    com.saas.foundation: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: local

saas:
  integrations:
    email:
      api-key: ${RESEND_API_KEY}
      from: ${RESEND_FROM}
  security:
    jwt:
      secret: local-dev-only-jwt-secret-not-for-production

logging:
  level:
    com.saas.foundation: DEBUG

---
spring:
  config:
    activate:
      on-profile: "!prod"
  datasource:
    username: saas_app
    password: saas_app
  flyway:
    user: saas
    password: saas
