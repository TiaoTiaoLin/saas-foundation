spring:
  main:
    allow-bean-definition-overriding: true

  kafka:
    listener:
      auto-startup: false

saas:
  kafka:
    enabled: false
  security:
    jwt:
      secret: test-only-jwt-secret-at-least-32-bytes-long
  rate-limit:
    enabled: true
    capacity: 100
    window: 1m

logging:
  level:
    com.saas.foundation: INFO
